<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TASKFLOW — Project Management MVP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="grain-overlay"></div>
    
    <header class="header">
        <div class="header-content">
            <h1 class="logo">TASKFLOW</h1>
            <div class="header-stats">
                <div class="stat">
                    <span class="stat-label">TOTAL</span>
                    <span class="stat-value" id="totalTasks">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">ACTIVE</span>
                    <span class="stat-value" id="activeTasks">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">DONE</span>
                    <span class="stat-value" id="completedTasks">0</span>
                </div>
            </div>
        </div>
        <div class="header-line"></div>
    </header>

    <main class="container">
        <section class="add-task-section">
            <div class="section-header">
                <h2 class="section-title">ADD NEW TASK</h2>
                <div class="accent-bar"></div>
            </div>
            
            <form id="taskForm" class="task-form">
                <div class="form-group">
                    <label for="taskTitle">TASK TITLE</label>
                    <input 
                        type="text" 
                        id="taskTitle" 
                        placeholder="Enter task name..."
                        required
                        autocomplete="off"
                    >
                </div>
                
                <div class="form-group">
                    <label for="taskProject">PROJECT</label>
                    <input 
                        type="text" 
                        id="taskProject" 
                        placeholder="e.g., Mobile App, Website Redesign..."
                        autocomplete="off"
                    >
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="taskPriority">PRIORITY</label>
                        <select id="taskPriority">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                            <option value="urgent">Urgent</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="taskDueDate">DUE DATE</label>
                        <input type="date" id="taskDueDate">
                    </div>
                </div>
                
                <button type="submit" class="btn-submit">
                    <span>CREATE TASK</span>
                    <span class="btn-arrow">→</span>
                </button>
            </form>
        </section>

        <section class="tasks-section">
            <div class="section-header">
                <h2 class="section-title">TASK BOARD</h2>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">ALL</button>
                    <button class="filter-btn" data-filter="active">ACTIVE</button>
                    <button class="filter-btn" data-filter="completed">COMPLETED</button>
                </div>
            </div>
            
            <div id="tasksList" class="tasks-list">
                <div class="empty-state">
                    <div class="empty-icon">⚡</div>
                    <h3>NO TASKS YET</h3>
                    <p>Create your first task to get started</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>TASKFLOW MVP — Built with ⚡ by Your Startup Team</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
